<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">n8n-fabric MCP tools</title>
  <desc id="d">Thirty-six MCP tools across eight groups: workflows, executions, credentials, tags and variables, projects and users, community nodes, source control, and system.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#a071ff"/><stop offset="1" stop-color="#ff6d5a"/></linearGradient></defs>
  <style>
