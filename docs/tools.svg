  <rect width="960" height="400" rx="20" fill="#120f1c"/>
  <text x="40" y="54" font-size="26" font-weight="800" style="fill:url(#title)">36 tools, full n8n control</text>
  <text x="42" y="80" font-size="14" class="muted">Everything the n8n REST API exposes — plus semantic search — from your AI assistant.</text>
