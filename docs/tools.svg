  <text x="740" y="168" font-size="10" class="mono muted"><tspan x="740" dy="0">tag: list · create · delete</tspan><tspan x="740" dy="14">var: list · get</tspan><tspan x="740" dy="14">var: create · delete</tspan></text></g><g class="g4"><rect x="40" y="260" width="210" height="92" rx="11" fill="#1a1527" stroke="#3b82f6" stroke-opacity=".5"/>
  <circle cx="58" cy="284" r="5" fill="#3b82f6"/>
  <text x="72" y="289" font-size="14" font-weight="800">Projects &amp; Users</text>
  <text x="234" y="289" text-anchor="end" font-size="12" font-weight="800" style="fill:#3b82f6">4</text>
  <text x="56" y="310" font-size="10" class="mono muted"><tspan x="56" dy="0">project: list · create</tspan><tspan x="56" dy="14">project: delete · user: list</tspan></text></g><g class="g5"><rect x="268" y="260" width="210" height="92" rx="11" fill="#1a1527" stroke="#ec4899" stroke-opacity=".5"/>
  <circle cx="286" cy="284" r="5" fill="#ec4899"/>
  <text x="300" y="289" font-size="14" font-weight="800">Community nodes</text>
  <text x="462" y="289" text-anchor="end" font-size="12" font-weight="800" style="fill:#ec4899">3</text>
  <text x="284" y="310" font-size="10" class="mono muted"><tspan x="284" dy="0">list · install</tspan><tspan x="284" dy="14">uninstall</tspan></text></g><g class="g6"><rect x="496" y="260" width="210" height="92" rx="11" fill="#1a1527" stroke="#22d3ee" stroke-opacity=".5"/>
  <circle cx="514" cy="284" r="5" fill="#22d3ee"/>
