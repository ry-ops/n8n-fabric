  <text x="234" y="147" text-anchor="end" font-size="12" font-weight="800" style="fill:#a071ff">8</text>
  <text x="56" y="168" font-size="10" class="mono muted"><tspan x="56" dy="0">list · get · create · update</tspan><tspan x="56" dy="14">delete · activate</tspan><tspan x="56" dy="14">deactivate · execute</tspan></text></g><g class="g1"><rect x="268" y="118" width="210" height="92" rx="11" fill="#1a1527" stroke="#ff6d5a" stroke-opacity=".5"/>
