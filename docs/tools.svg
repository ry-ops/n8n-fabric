  <text x="284" y="168" font-size="10" class="mono muted"><tspan x="284" dy="0">list · get · delete</tspan><tspan x="284" dy="14">retry · stop</tspan></text></g><g class="g2"><rect x="496" y="118" width="210" height="92" rx="11" fill="#1a1527" stroke="#f59e0b" stroke-opacity=".5"/>
